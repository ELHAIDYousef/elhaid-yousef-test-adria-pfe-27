spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**
            - id: chatbot-service
              uri: lb://chatbot-service
              predicates:
                - Path=/chat/**

server:
  port: 8888

eureka:
  instance:
    prefer-ip-address: true