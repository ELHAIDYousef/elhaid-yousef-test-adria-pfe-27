spring:
  application:
    name: account-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${ACCOUNT_DB_HOST}:${ACCOUNT_DB_PORT}/${ACCOUNT_DB_NAME}
    username: ${ACCOUNT_DB_USERNAME}
    password: ${ACCOUNT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    discovery:
      enabled: false

  ai:
    mcp:
      server:
        name: account-mcp-server
        version: 1.0.0
        protocol: STREAMABLE


  graphql:
    graphiql:
      enabled: true

server:
  port: 8081

