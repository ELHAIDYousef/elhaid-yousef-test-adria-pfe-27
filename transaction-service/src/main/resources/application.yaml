spring:
  application:
    name: transaction-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${TRANSACTION_DB_HOST}:${TRANSACTION_DB_PORT}/${TRANSACTION_DB_NAME}
    username: ${TRANSACTION_DB_USERNAME}
    password: ${TRANSACTION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  graphql:
    graphiql:
      enabled: true
  ai:
    mcp:
      server:
        name: transaction-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
  cloud:
    discovery:
      enabled: false

server:
  port: 8082

bank:
  transaction:
    max-amount: 1000